<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Produkcja</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/12721/12721102.png?v=4">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/12721/12721102.png?v=4">

    <style>
        :root { --bg: #121214; --card-bg: #1c1c1e; --nav-bg: #2c2c2e; --primary: #0a84ff; --success: #32d74b; --danger: #ff453a; --warning: #ffd60a; --text-main: #ffffff; --text-dim: #8e8e93; --border: #38383a; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text-main); }
        .container { max-width: 500px; margin: auto; }
        .sync-status { text-align: center; font-size: 11px; margin: 10px 0; color: var(--text-dim); }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; display: none; margin-bottom: 10px; border: 1px solid var(--border); }
        .card.active { display: block; }
        .nav { display: flex; background: var(--nav-bg); padding: 4px; border-radius: 10px; margin-bottom: 15px; }
        .nav-btn { flex: 1; border: none; padding: 12px 5px; border-radius: 8px; font-weight: 600; color: var(--text-dim); background: none; font-size: 11px; text-transform: uppercase; }
        .nav-btn.active { background: var(--primary); color: white; }
        label { display: block; font-size: 10px; font-weight: 700; color: var(--text-dim); margin-top: 12px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-top: 5px; font-size: 16px; box-sizing: border-box; background: #2c2c2e; color: white; }
        .row { display: flex; gap: 8px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; color: white; margin-top: 15px; }
        .btn-green { background: var(--success); }
        .btn-blue { background: var(--primary); }
        .btn-orange { background: #ff9500; }
        .btn-grey { background: #3a3a3c; }
        .prod-cost-display { background: rgba(255, 214, 10, 0.1); padding: 12px; border-radius: 10px; margin-top: 15px; font-weight: 800; text-align: center; color: var(--warning); border: 1px solid var(--warning); }
        .year-box { background: #000; padding: 20px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid var(--primary); }
        .year-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; font-size: 10px; color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 10px; }
        .month-acc { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
        .month-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .month-content { display: none; padding: 10px; border-top: 1px solid var(--border); background: #151517; }
        .month-content.open { display: block; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 10px 5px; border-bottom: 1px solid var(--border); font-size: 12px; }
        .btn-del { color: var(--danger); background: none; border: 1px solid var(--danger); padding: 4px 8px; border-radius: 5px; font-size: 10px; }
        .mode-switch { display: flex; gap: 5px; margin-top: 5px; background: #000; padding: 4px; border-radius: 8px; }
        .mode-opt { flex:1; text-align:center; padding: 8px; font-size: 10px; font-weight: 700; border-radius: 6px; cursor:pointer; color: #8e8e93; }
        .mode-opt.active { background: #3a3a3c; color: white; }
        
.backup-panel{display:flex;gap:10px;margin-bottom:15px}
.backup-tile{flex:1;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;cursor:pointer}
.backup-icon{font-size:22px;margin-bottom:4px}
.backup-text{font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase}

.salary-row { background: rgba(255, 149, 0, 0.05); }

        .btn-red { background: var(--danger); }
        .btn-small { width:auto; padding:10px 12px; margin-top:0; font-size:12px; }
        .clickable-row { cursor:pointer; }
        .clickable-row:active { background:#2a2a2d; }
        .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; align-items:flex-end; justify-content:center; z-index:9999; padding:12px; box-sizing:border-box; }
        .modal-backdrop.open { display:flex; }
        .modal { width:min(560px,100%); max-height:90vh; overflow:auto; background:var(--card-bg); border:1px solid var(--border); border-radius:16px; padding:16px; box-sizing:border-box; box-shadow:0 20px 60px rgba(0,0,0,.45); }
        .modal-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
        .modal-title { font-size:18px; font-weight:800; }
        .modal-close { border:0; background:#3a3a3c; color:white; width:34px; height:34px; border-radius:50%; font-size:18px; cursor:pointer; }
        .details-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
        .detail-box { background:#151517; border:1px solid var(--border); border-radius:10px; padding:10px; }
        .detail-box small { color:var(--text-dim); display:block; margin-bottom:4px; text-transform:uppercase; font-size:9px; font-weight:700; }
        .detail-box b { font-size:14px; }
        .modal-actions { display:flex; gap:8px; margin-top:14px; }
        .modal-actions .btn { margin-top:0; }
        .history-item { border-bottom:1px solid var(--border); padding:12px 0; }
        .history-item:last-child { border-bottom:0; }
        .history-top { display:flex; justify-content:space-between; gap:8px; }
        .history-meta { color:var(--text-dim); font-size:11px; margin-top:4px; line-height:1.45; }
        .github-setup { background:#151517; border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:15px; }
        .github-setup .row { align-items:end; }
    </style>
</head>
<body>

<div class="container">
    <div id="status" class="sync-status">Ładowanie systemu...</div>
    <div id="githubSetup" class="github-setup" style="display:none;">
        <label>Token GitHub (zapisywany tylko na tym urządzeniu)</label>
        <input type="password" id="githubToken" placeholder="github_pat_...">
        <div class="row">
            <button class="btn btn-blue" onclick="saveGithubToken()">ZAPISZ TOKEN I POŁĄCZ</button>
            <button class="btn btn-grey btn-small" onclick="hideGithubSetup()">ANULUJ</button>
        </div>
    </div>
    <button id="githubSettingsBtn" class="btn btn-grey" style="margin:0 0 15px 0; padding:10px; font-size:12px;" onclick="showGithubSetup()">USTAWIENIA GITHUB</button>

    <div class="nav">
        <button id="tab1" class="nav-btn active" onclick="switchTab('calc')">KREATOR</button>
        <button id="tab2" class="nav-btn" onclick="switchTab('sales')">SPRZEDAŻ</button>
        <button id="tab3" class="nav-btn" onclick="switchTab('stats')">WYNIKI</button><button id="tab4" class="nav-btn" onclick="switchTab('clients')">KLIENCI</button>
    </div>

    <div id="calc" class="card active">
        <input type="hidden" id="editIdx" value="-1">
        <label>Nazwa modelu</label><input type="text" id="pName">
        <div class="row">
            <div style="flex:1"><label>Deska 1/m³</label><input type="text" inputmode="decimal" id="pWood1" value="700"></div>
            <div style="flex:1"><label>Deska 2/m³</label><input type="text" inputmode="decimal" id="pWood2" value="700"></div>
        </div>
        <div class="row">
            <div style="flex:1"><label>Klocek/m³</label><input type="text" inputmode="decimal" id="pBlocks" value="740"></div>
            <div style="flex:1"></div>
        </div>
        <label>Deska 1 (Dł x Sz x Gr)CM</label>
        <div class="row"><input type="text" inputmode="decimal" id="d1L" placeholder="Dł"><input type="text" inputmode="decimal" id="d1S" placeholder="Sz"><input type="text" inputmode="decimal" id="d1G" placeholder="Gr"></div>
        <label>Ilość Desek 1</label><input type="text" inputmode="decimal" id="d1Qty">
        <label>Deska 2 (Dł x Sz x Gr)CM</label>
        <div class="row"><input type="text" inputmode="decimal" id="d2L" placeholder="Dł"><input type="text" inputmode="decimal" id="d2S" placeholder="Sz"><input type="text" inputmode="decimal" id="d2G" placeholder="Gr"></div>
        <label>Ilość Desek 2</label><input type="text" inputmode="decimal" id="d2Qty" value="0">
        <label>Klocki (szt)</label><input type="text" inputmode="decimal" id="bQty">
        <div id="liveCostDisplay" class="prod-cost-display">0.00 PLN</div>
        <button id="saveBtn" class="btn btn-green" onclick="saveModel()">ZAPISZ MODEL</button>
        <button id="cancelEditBtn" class="btn btn-grey" style="display:none;" onclick="cancelEdit()">ANULUJ</button>
        <div style="margin-top:20px"><label>TWOJE MODELE:</label><table id="editModelList"></table></div>
    </div>

    <div id="sales" class="card">
        <div class="mode-switch">
            <div id="optProd" class="mode-opt active" onclick="setSaleMode('prod')">WŁASNA PRODUKCJA</div>
            <div id="optBuy" class="mode-opt" onclick="setSaleMode('buy')">KUPNO-SPRZEDAŻ</div>
        </div>
        <div id="prodFields">
            <label>Model</label><select id="palletSelect" onchange="updateProfitHint()"></select>
        </div>
        <div id="buyFields" style="display:none;">
            <label>Nazwa towaru</label><input type="text" id="buyName" placeholder="Np. Paleta używana">
            <label>Cena zakupu (szt)</label><input type="text" inputmode="decimal" id="buyCost" oninput="updateProfitHint()">
        </div>
        <label>Data sprzedaży</label><input type="date" id="saleDate"><label>Klient</label><input type="text" id="clientName" list="clientsList"><datalist id="clientsList"></datalist>
        <div class="row">
            <div style="flex:1"><label>Ilość</label><input type="text" inputmode="decimal" id="saleQty"></div>
            <div style="flex:1"><label>Cena sprzedaży</label><input type="text" inputmode="decimal" id="salePrice" oninput="updateProfitHint()"></div>
        </div>
        <div id="profitHint" style="margin-top:15px; text-align:center;"></div>
        <button class="btn btn-blue" onclick="addSale()">DODAJ SPRZEDAŻ</button>
        <hr style="margin:25px 0; border:0; border-top:1px solid var(--border);">
        <label style="color:var(--warning)">Zaksięguj Tygodniówkę</label>
        <input type="date" id="salaryDate">
        <input type="text" inputmode="decimal" id="salaryAmount" placeholder="Kwota tygodniówki (PLN)">
        <button class="btn btn-orange" onclick="addWeeklySalary()">ROZLICZ TYGODNIÓWKĘ</button>
    </div>

    <div id="stats" class="card">
    <div class="backup-panel">
        <div class="backup-tile" onclick="exportData()">
            <div class="backup-icon">💾</div>
            <div class="backup-text">Eksport</div>
        </div>
        <div class="backup-tile" onclick="document.getElementById('importFile').click()">
            <div class="backup-icon">📂</div>
            <div class="backup-text">Import</div>
        </div>
        <div class="backup-tile" onclick="importMerge()">
            <div class="backup-icon">🔄</div>
            <div class="backup-text">Scal</div>
        </div>
        <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
    <div id="yearStatsContainer"></div>
    <div id="monthsContainer"></div>
</div>

<div id="clients" class="card"><div id="clientsContainer"></div></div>
</div>

<div id="saleModalBackdrop" class="modal-backdrop" onclick="if(event.target===this) closeSaleModal()">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">Szczegóły sprzedaży</div><button class="modal-close" onclick="closeSaleModal()">×</button></div>
    <div id="saleDetailsView"></div>
    <div id="saleEditView" style="display:none;">
      <input type="hidden" id="editSaleId">
      <label>Data sprzedaży</label><input type="date" id="editSaleDate">
      <label>Klient</label><input type="text" id="editSaleClient">
      <label>Co sprzedano</label><input type="text" id="editSaleName">
      <div class="row">
        <div style="flex:1"><label>Ilość</label><input type="text" inputmode="decimal" id="editSaleQty"></div>
        <div style="flex:1"><label>Cena netto / szt.</label><input type="text" inputmode="decimal" id="editSalePrice"></div>
      </div>
      <label>Koszt / szt.</label><input type="text" inputmode="decimal" id="editSaleUnitCost">
      <div class="modal-actions">
        <button class="btn btn-green" onclick="saveSaleEdit()">ZAPISZ ZMIANY</button>
        <button class="btn btn-grey" onclick="cancelSaleEdit()">ANULUJ</button>
      </div>
    </div>
  </div>
</div>

<div id="clientModalBackdrop" class="modal-backdrop" onclick="if(event.target===this) closeClientModal()">
  <div class="modal">
    <div class="modal-head"><div id="clientModalTitle" class="modal-title">Klient</div><button class="modal-close" onclick="closeClientModal()">×</button></div>
    <div id="clientDetails"></div>
  </div>
</div>

<script>
    const GITHUB_OWNER = 'mateuszmarczakmmp-lab';
    const GITHUB_REPO = 'Produkcjaa-DB';
    const GITHUB_DB_PATH = 'database.json';
    const GITHUB_REPO_API = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`;
    const GITHUB_API = `${GITHUB_REPO_API}/contents/${GITHUB_DB_PATH}`;

    let githubFileSha = null, githubBranch = null, saleMode = 'prod';
    let db = { models: [], sales: [] };

    function getGithubToken() { return localStorage.getItem('github_produkcja_token') || ''; }
    function setStatus(msg) { const el=document.getElementById('status'); if(el) el.innerText=msg; }
    function showGithubSetup() { document.getElementById('githubSetup').style.display='block'; document.getElementById('githubToken').value=getGithubToken(); }
    function hideGithubSetup() { document.getElementById('githubSetup').style.display='none'; }

    async function saveGithubToken() {
        const token = document.getElementById('githubToken').value.trim();
        if(!token) return alert('Wklej token GitHub.');
        localStorage.setItem('github_produkcja_token', token);
        hideGithubSetup();
        githubFileSha = null;
        githubBranch = null;
        await initializeFile();
    }

    function githubHeaders() {
        const token = getGithubToken();
        return {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28'
        };
    }

    function utf8ToBase64(str) {
        const bytes = new TextEncoder().encode(str);
        let binary = '';
        bytes.forEach(b => binary += String.fromCharCode(b));
        return btoa(binary);
    }
    function base64ToUtf8(b64) {
        const binary = atob((b64 || '').replace(/\n/g,''));
        const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
        return new TextDecoder().decode(bytes);
    }

    async function githubErrorText(resp) {
        let body = {};
        try { body = await resp.json(); } catch(e) {}
        const msg = body && body.message ? body.message : 'Brak dodatkowego komunikatu';
        return `HTTP ${resp.status}: ${msg}`;
    }

    async function checkRepositoryAccess() {
        const resp = await fetch(GITHUB_REPO_API, { headers: githubHeaders() });
        if(!resp.ok) {
            const details = await githubErrorText(resp);
            if(resp.status === 404) {
                throw new Error(`${details}\n\nGitHub nie udostępnia repozytorium ${GITHUB_REPO} temu tokenowi. Sprawdź, czy token ma wybrane dokładnie repozytorium ${GITHUB_REPO}.`);
            }
            if(resp.status === 403) {
                throw new Error(`${details}\n\nToken nie ma wymaganego dostępu. Ustaw Contents: Read and write.`);
            }
            if(resp.status === 401) {
                throw new Error(`${details}\n\nToken jest nieprawidłowy albo wygasł.`);
            }
            throw new Error(details);
        }
        const repo = await resp.json();
        githubBranch = repo.default_branch || 'main';
        return repo;
    }

    async function initializeFile() {
        if(!getGithubToken()) {
            setStatus('Wymagany token GitHub ⚠️');
            showGithubSetup();
            renderSelect(); renderStats(); renderModelEditList(); renderClientsList();
            return false;
        }
        setStatus('Łączenie z GitHub... ⏳');
        try {
            const repo = await checkRepositoryAccess();
            // Nie podajemy ref na sztywno. GitHub użyje domyślnej gałęzi repozytorium.
            const resp = await fetch(GITHUB_API, { headers: githubHeaders() });
            if(resp.status === 404) {
                db = { models: [], sales: [] };
                githubFileSha = null;
                const ok = await saveToCloud(true, repo && repo.size === 0);
                if(ok) setStatus('Połączono z GitHub ✅');
                renderSelect(); renderStats(); renderModelEditList(); renderClientsList();
                return ok;
            }
            if(!resp.ok) throw new Error(await githubErrorText(resp));
            const file = await resp.json();
            githubFileSha = file.sha;
            const parsed = JSON.parse(base64ToUtf8(file.content));
            db = parsed && parsed.data && parsed.version ? parsed.data : parsed;
            if(!db || !Array.isArray(db.models) || !Array.isArray(db.sales)) db = { models: [], sales: [] };
            setStatus(`Połączono z GitHub ✅ (${githubBranch})`);
            renderSelect(); renderStats(); renderModelEditList(); renderClientsList();
            return true;
        } catch(err) {
            console.error(err);
            setStatus('Błąd GitHub ❌');
            alert('Nie udało się połączyć z GitHub.\n\n' + (err && err.message ? err.message : err));
            showGithubSetup();
            return false;
        }
    }

    async function saveToCloud(isInitialCreate = false, repoIsEmpty = false) {
        const token = getGithubToken();
        if(!token) { setStatus('Brak tokenu GitHub ⚠️'); showGithubSetup(); return false; }
        setStatus('Zapisywanie na GitHub... ⏳');
        try {
            if(!githubBranch) await checkRepositoryAccess();
            const payload = {
                message: `Aktualizacja bazy ${new Date().toLocaleString('pl-PL')}`,
                content: utf8ToBase64(JSON.stringify(db, null, 2))
            };
            if(githubFileSha) {
                payload.sha = githubFileSha;
                payload.branch = githubBranch;
            } else if(!repoIsEmpty && githubBranch) {
                // Dla istniejącego repo zapisujemy do domyślnej gałęzi.
                payload.branch = githubBranch;
            }
            // Dla całkowicie pustego repo nie wysyłamy pola branch. GitHub utworzy plik na gałęzi domyślnej.
            let resp = await fetch(GITHUB_API, {
                method: 'PUT',
                headers: { ...githubHeaders(), 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if(!resp.ok && (resp.status === 409 || resp.status === 422)) {
                const latest = await fetch(GITHUB_API, { headers: githubHeaders() });
                if(latest.ok) {
                    const f = await latest.json();
                    githubFileSha = f.sha;
                    payload.sha = githubFileSha;
                    if(githubBranch) payload.branch = githubBranch;
                    resp = await fetch(GITHUB_API, {
                        method:'PUT',
                        headers:{...githubHeaders(),'Content-Type':'application/json'},
                        body:JSON.stringify(payload)
                    });
                }
            }
            if(!resp.ok) throw new Error(await githubErrorText(resp));
            const result = await resp.json();
            githubFileSha = result.content && result.content.sha ? result.content.sha : githubFileSha;
            setStatus('Zapisano na GitHub ✅');
            return true;
        } catch(err) {
            console.error(err);
            setStatus('Błąd zapisu GitHub ❌');
            alert('Nie udało się zapisać danych na GitHub.\n\n' + (err && err.message ? err.message : err));
            return false;
        }
    }

    document.addEventListener('DOMContentLoaded', initializeFile);

    function setSaleMode(m) {
        saleMode = m;
        document.getElementById('optProd').classList.toggle('active', m === 'prod');
        document.getElementById('optBuy').classList.toggle('active', m === 'buy');
        document.getElementById('prodFields').style.display = m === 'prod' ? 'block' : 'none';
        document.getElementById('buyFields').style.display = m === 'buy' ? 'block' : 'none';
        updateProfitHint();
    }

    
function calculateLiveCost() {
        const pw1 = parseFloat((document.getElementById('pWood1')?.value || document.getElementById('pWood')?.value || '0').replace(',', '.')) || 0;
        const pw2 = parseFloat((document.getElementById('pWood2')?.value || document.getElementById('pWood')?.value || '0').replace(',', '.')) || 0;
        const pb = parseFloat(document.getElementById('pBlocks').value.replace(',', '.')) || 0;

        const getV = (l, s, g, q) => (parseFloat(String(l).replace(',', '.'))*parseFloat(String(s).replace(',', '.'))*parseFloat(String(g).replace(',', '.'))/1000000) * (parseInt(q)||0);

        const v1 = getV(d1L.value,d1S.value,d1G.value,d1Qty.value);
        const v2 = getV(d2L.value,d2S.value,d2G.value,d2Qty.value);
        const vb = (7.5 * 7.5 * 7.8 / 1000000) * (parseInt(document.getElementById('bQty').value) || 0);

        const cost1 = v1 * pw1;
        const cost2 = v2 * pw2;
        const costB = vb * pb;
        const cost = cost1 + cost2 + costB;

        document.getElementById('liveCostDisplay').innerHTML =
        `Deska 1: ${cost1.toFixed(2)} PLN<br>
        Deska 2: ${cost2.toFixed(2)} PLN<br>
        Klocki: ${costB.toFixed(2)} PLN<br>
        <hr style="border-color:#555;">
        <b>Razem: ${cost.toFixed(2)} PLN / szt.</b>`;

        return cost;
    }

    document.querySelectorAll('#calc input').forEach(input => input.addEventListener('input', calculateLiveCost));

    function saveModel() {
        const n = document.getElementById('pName').value;
        const cost = calculateLiveCost();
        const editIdx = parseInt(document.getElementById('editIdx').value);
        if(!n || cost <= 0) return alert("Błąd!");
        const modelData = { name: n, cost: cost, pWood1: document.getElementById('pWood1').value, pWood2: document.getElementById('pWood2').value, pBlocks: document.getElementById('pBlocks').value, d1L: document.getElementById('d1L').value, d1S: document.getElementById('d1S').value, d1G: document.getElementById('d1G').value, d1Qty: document.getElementById('d1Qty').value, d2L: document.getElementById('d2L').value, d2S: document.getElementById('d2S').value, d2G: document.getElementById('d2G').value, d2Qty: document.getElementById('d2Qty').value, bQty: document.getElementById('bQty').value };
        if(editIdx > -1) db.models[editIdx] = modelData; else db.models.push(modelData);
        cancelEdit(); saveToCloud().then(() => { renderSelect(); renderModelEditList(); renderClientsList(); });
    }

    function renderModelEditList() { document.getElementById('editModelList').innerHTML = db.models.map((m, i) => `<tr><td>${m.name}</td><td style="text-align:right"><button class="btn-del" style="color:var(--primary); border-color:var(--primary); margin-right:5px" onclick="startEdit(${i})">EDYCJA</button><button class="btn-del" onclick="deleteModel(${i})">X</button></td></tr>`).join(''); }
    function startEdit(i) {
        const m = db.models[i]; document.getElementById('editIdx').value = i; document.getElementById('pName').value = m.name;
        ['pWood1','pWood2','pBlocks','d1L','d1S','d1G','d1Qty','d2L','d2S','d2G','d2Qty','bQty'].forEach(k => document.getElementById(k).value = m[k] || "");
        document.getElementById('saveBtn').innerText = "AKTUALIZUJ"; document.getElementById('saveBtn').className = "btn btn-orange"; document.getElementById('cancelEditBtn').style.display = "block"; calculateLiveCost(); window.scrollTo(0,0);
    }
    function cancelEdit() { document.getElementById('editIdx').value = "-1"; document.getElementById('saveBtn').innerText = "ZAPISZ MODEL"; document.getElementById('saveBtn').className = "btn btn-green"; document.getElementById('cancelEditBtn').style.display = "none"; document.querySelectorAll('#calc input').forEach(inp => { if(inp.id !== 'pWood1' && inp.id !== 'pWood2' && inp.id !== 'pBlocks') inp.value = ""; }); calculateLiveCost(); }
    function deleteModel(i) { if(confirm("Usunąć?")) { db.models.splice(i, 1); saveToCloud().then(() => { renderSelect(); renderModelEditList(); renderClientsList(); }); } }
    function renderSelect() { document.getElementById('palletSelect').innerHTML = db.models.map((m, i) => `<option value="${i}">${m.name}</option>`).join(''); updateProfitHint(); }

    function updateProfitHint() {
        const sPrice = parseFloat(document.getElementById('salePrice').value.replace(',', '.')) || 0;
        let cost = 0;
        if(saleMode === 'prod') {
            const idx = document.getElementById('palletSelect').value;
            if(db.models[idx]) cost = db.models[idx].cost;
        } else {
            cost = parseFloat(document.getElementById('buyCost').value.replace(',', '.')) || 0;
        }
        if(sPrice > 0) {
            const profit = sPrice - cost;
            document.getElementById('profitHint').innerHTML = `Zysk: <span style="color:${profit>=0?'var(--success)':'var(--danger)'}">${profit.toFixed(2)} PLN/szt.</span>`;
        } else document.getElementById('profitHint').innerText = "";
    }

    function addSale() {
        const qty = parseInt(document.getElementById('saleQty').value);
        const sPrice = parseFloat(document.getElementById('salePrice').value.replace(',', '.'));
        if(!qty || !sPrice) return alert("Błąd!");
        let name, unitCost;
        if(saleMode === 'prod') {
            const idx = document.getElementById('palletSelect').value;
            name = db.models[idx].name; unitCost = db.models[idx].cost;
        } else {
            name = "[Kupno] " + document.getElementById('buyName').value;
            unitCost = parseFloat(document.getElementById('buyCost').value.replace(',', '.')) || 0;
        }
        const selectedDate = document.getElementById('saleDate').value;
        const d = selectedDate ? new Date(selectedDate) : new Date();
        db.sales.push({ id: Date.now().toString(), date: d.toLocaleDateString(), year: d.getFullYear(), month: (d.getMonth()+1).toString().padStart(2,'0') + '/' + d.getFullYear(), name: name, client: document.getElementById('clientName').value || "Brak", qty: qty, prof: (sPrice - unitCost) * qty, cost: unitCost * qty, rev: sPrice * qty });
        saveToCloud().then(ok => { if(ok) { document.getElementById("saleQty").value = ""; renderStats(); renderClientsList(); alert("Dodano!"); } });
    }

    function addWeeklySalary() {
        const dateInput = document.getElementById('salaryDate').value;
        const amount = parseFloat(document.getElementById('salaryAmount').value.replace(',', '.'));
        if(!dateInput || !amount) return alert("Wpisz datę i kwotę!");
        const fri = new Date(dateInput);
        const dayVal = amount / 5;
        for(let i=0; i<5; i++) {
            let d = new Date(fri); d.setDate(fri.getDate() - (4 - i));
            db.sales.push({
                id: "sal-" + Date.now() + i,
                date: d.toLocaleDateString(),
                year: d.getFullYear(),
                month: (d.getMonth()+1).toString().padStart(2,'0') + '/' + d.getFullYear(),
                name: "TYGODNIÓWKA", client: "Praca", qty: 0,
                prof: dayVal, cost: 0, rev: dayVal
            });
        }
        saveToCloud().then(() => { renderStats(); alert("Tygodniówka rozliczona!"); });
    }

    function renderStats() {
        const monthsContainer = document.getElementById('monthsContainer');
        const yearContainer = document.getElementById('yearStatsContainer');
        monthsContainer.innerHTML = ""; yearContainer.innerHTML = "";
        if(!db.sales || db.sales.length === 0) return;
        const curYear = new Date().getFullYear();
        let yS = { p: 0, c: 0, q: 0, r: 0 }; let mD = {};

        db.sales.forEach(s => {
            const rev = s.rev || (s.prof + s.cost);
            // FILTR BEZPIECZEŃSTWA: Tygodniówka to zawsze 0 sztuk, niezależnie co jest w bazie
            const qty = s.name === "TYGODNIÓWKA" ? 0 : (parseInt(s.qty) || 0);
            
            if(s.year == curYear) { yS.p += s.prof; yS.c += s.cost; yS.q += qty; yS.r += rev; }
            if(!mD[s.month]) mD[s.month] = { p: 0, c: 0, q: 0, items: [] };
            mD[s.month].p += s.prof; mD[s.month].c += s.cost; mD[s.month].q += qty; mD[s.month].items.push(s);
        });

        yearContainer.innerHTML = `<div class="year-box"><small>ZYSK ${curYear}</small><div style="font-size:28px; font-weight:800; color:var(--success); margin: 5px 0;">+${yS.p.toFixed(2)} PLN</div><div class="year-grid"><div>PRZYCHÓD<br><b style="color:white">${yS.r.toFixed(0)}</b></div><div>KOSZTY<br><b style="color:var(--danger)">${yS.c.toFixed(0)}</b></div><div>SZTUK<br><b style="color:var(--primary)">${yS.q}</b></div></div></div>`;

        Object.keys(mD).sort().reverse().forEach(m => {
            const data = mD[m];
            const div = document.createElement('div'); div.className = 'month-acc';
            let salarySum = 0;
            let normalItems = [];
            data.items.forEach(item => {
                if(item.name === "TYGODNIÓWKA") salarySum += item.prof;
                else normalItems.push(item);
            });
            let salaryHtml = salarySum > 0 ? `<tr class="salary-row"><td><b style="color:var(--warning)">TYGODNIÓWKA (SUMA)</b><br><small>Rozliczenie miesięczne</small></td><td style="text-align:center">-</td><td style="text-align:right"><b style="color:var(--success)">+${salarySum.toFixed(2)}</b><br><small style="font-size:8px; color:var(--text-dim)">rozliczone</small></td></tr>` : "";
            div.innerHTML = `<div class="month-header" onclick="toggleMonth('${m}')"><div><b>${m}</b></div><div style="text-align:right"><b style="color:var(--success)">+${data.p.toFixed(2)}</b><br><small>${data.q} szt.</small></div></div><div id="content-${m.replace('/','-')}" class="month-content"><table>${salaryHtml}${normalItems.slice().reverse().map(item => `<tr class="clickable-row" onclick="openSaleDetails('${item.id}')"><td><b>${item.name}</b><br><small>${item.client} | ${item.date}</small></td><td style="text-align:center">x${item.qty}</td><td style="text-align:right"><b style="color:var(--success)">+${item.prof.toFixed(2)}</b><br><small style="color:var(--text-dim)">szczegóły ›</small></td></tr>`).join('')}</table></div>`;
            monthsContainer.appendChild(div);
        });
    }

    function toggleMonth(m) { document.getElementById('content-' + m.replace('/','-')).classList.toggle('open'); }
    function money(v) { return (Number(v)||0).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' zł'; }
    function parsePlDate(dateStr) {
        if(!dateStr) return '';
        const parts = String(dateStr).split(/[.\/\-]/);
        if(parts.length===3) {
            if(parts[0].length===4) return `${parts[0]}-${String(parts[1]).padStart(2,'0')}-${String(parts[2]).padStart(2,'0')}`;
            return `${parts[2]}-${String(parts[1]).padStart(2,'0')}-${String(parts[0]).padStart(2,'0')}`;
        }
        return '';
    }
    function dateFromInput(v) { const [y,m,d]=v.split('-').map(Number); return new Date(y,m-1,d); }

    function openSaleDetails(id) {
        const s = (db.sales||[]).find(x => String(x.id)===String(id));
        if(!s || s.name==='TYGODNIÓWKA') return;
        const qty = Number(s.qty)||0;
        const netTotal = Number(s.rev)||0;
        const unitNet = qty ? netTotal/qty : 0;
        const grossTotal = netTotal * 1.23;
        const unitGross = unitNet * 1.23;
        const profit = Number(s.prof)||0;
        document.getElementById('saleDetailsView').innerHTML = `
          <div class="details-grid">
            <div class="detail-box"><small>Data sprzedaży</small><b>${s.date||'-'}</b></div>
            <div class="detail-box"><small>Klient</small><b>${s.client||'Brak'}</b></div>
            <div class="detail-box" style="grid-column:1/-1"><small>Sprzedano</small><b>${s.name||'-'} × ${qty} szt.</b></div>
            <div class="detail-box"><small>Netto / szt.</small><b>${money(unitNet)}</b></div>
            <div class="detail-box"><small>Brutto / szt.</small><b>${money(unitGross)}</b></div>
            <div class="detail-box"><small>Łącznie netto</small><b>${money(netTotal)}</b></div>
            <div class="detail-box"><small>Łącznie brutto (23% VAT)</small><b>${money(grossTotal)}</b></div>
            <div class="detail-box" style="grid-column:1/-1"><small>Zysk</small><b style="color:${profit>=0?'var(--success)':'var(--danger)'}">${money(profit)}</b></div>
          </div>
          <div class="modal-actions">
            <button class="btn btn-blue" onclick="startSaleEdit('${s.id}')">EDYTUJ</button>
            <button class="btn btn-red" onclick="deleteSale('${s.id}', true)">USUŃ</button>
          </div>`;
        document.getElementById('saleEditView').style.display='none';
        document.getElementById('saleDetailsView').style.display='block';
        document.getElementById('saleModalBackdrop').classList.add('open');
    }
    function closeSaleModal(){ document.getElementById('saleModalBackdrop').classList.remove('open'); }
    function startSaleEdit(id) {
        const s=(db.sales||[]).find(x=>String(x.id)===String(id)); if(!s) return;
        const qty=Number(s.qty)||0;
        document.getElementById('editSaleId').value=s.id;
        document.getElementById('editSaleDate').value=parsePlDate(s.date);
        document.getElementById('editSaleClient').value=s.client||'';
        document.getElementById('editSaleName').value=s.name||'';
        document.getElementById('editSaleQty').value=qty;
        document.getElementById('editSalePrice').value=(qty ? (Number(s.rev)||0)/qty : 0).toFixed(2).replace('.',',');
        document.getElementById('editSaleUnitCost').value=(qty ? (Number(s.cost)||0)/qty : 0).toFixed(2).replace('.',',');
        document.getElementById('saleDetailsView').style.display='none';
        document.getElementById('saleEditView').style.display='block';
    }
    function cancelSaleEdit(){ const id=document.getElementById('editSaleId').value; openSaleDetails(id); }
    async function saveSaleEdit() {
        const id=document.getElementById('editSaleId').value;
        const s=(db.sales||[]).find(x=>String(x.id)===String(id)); if(!s) return;
        const qty=parseInt(document.getElementById('editSaleQty').value);
        const price=parseFloat(document.getElementById('editSalePrice').value.replace(',','.'));
        const unitCost=parseFloat(document.getElementById('editSaleUnitCost').value.replace(',','.'))||0;
        const dateVal=document.getElementById('editSaleDate').value;
        if(!qty || !price || !dateVal) return alert('Uzupełnij datę, ilość i cenę.');
        const d=dateFromInput(dateVal);
        s.date=d.toLocaleDateString('pl-PL'); s.year=d.getFullYear(); s.month=(d.getMonth()+1).toString().padStart(2,'0')+'/'+d.getFullYear();
        s.client=document.getElementById('editSaleClient').value.trim()||'Brak';
        s.name=document.getElementById('editSaleName').value.trim()||s.name;
        s.qty=qty; s.rev=price*qty; s.cost=unitCost*qty; s.prof=(price-unitCost)*qty;
        const ok=await saveToCloud();
        if(ok){ renderStats(); renderClientsList(); renderClients(); openSaleDetails(id); }
    }
    async function deleteSale(id, fromModal=false) {
        if(!confirm('Usunąć tę sprzedaż?')) return;
        db.sales = db.sales.filter(s => String(s.id) !== String(id));
        const ok = await saveToCloud();
        if(ok){ renderStats(); renderClientsList(); renderClients(); if(fromModal) closeSaleModal(); }
    }
    
// =======================
// BACKUP / RESTORE SYSTEM
// =======================
function exportData() {
    const backup = { version: 1, exportDate: new Date().toISOString(), data: db };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    const date = new Date();
    link.href = URL.createObjectURL(blob);
    link.download = `produkcja_backup_${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}.json`;
    link.click();
    URL.revokeObjectURL(link.href);
}

document.addEventListener("DOMContentLoaded", () => {
    const importInput = document.getElementById("importFile");
    if(importInput) importInput.addEventListener("change", importData);
});

function importData(event) {
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async function(e){
        try{
            const imported = JSON.parse(e.target.result);
            const importedDb = imported.data || imported;
            if(!Array.isArray(importedDb.models) || !Array.isArray(importedDb.sales)){
                alert("Nieprawidłowy plik.");
                return;
            }
            if(!confirm("Ta operacja nadpisze aktualne dane. Kontynuować?")) return;
            db = importedDb;
            renderSelect();
            renderStats();
            renderModelEditList();
            await saveToCloud();
            alert("Dane zostały zaimportowane.");
        }catch(err){
            alert("Błąd odczytu pliku.");
        }
        event.target.value = "";
    };
    reader.readAsText(file);
}

function importMerge() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".json";
    input.onchange = function(e){
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = async function(ev){
            try{
                const imported = JSON.parse(ev.target.result);
                const importedDb = imported.data || imported;

                const existingNames = new Set(db.models.map(m => m.name));
                importedDb.models.forEach(model => {
                    if(!existingNames.has(model.name)) db.models.push(model);
                });

                const existingIds = new Set(db.sales.map(s => s.id));
                importedDb.sales.forEach(sale => {
                    if(!existingIds.has(sale.id)) db.sales.push(sale);
                });

                renderSelect();
                renderStats();
                renderModelEditList();
                await saveToCloud();
                alert("Dane zostały scalone.");
            } catch(err){
                alert("Błąd podczas scalania.");
            }
        };
        reader.readAsText(file);
    };
    input.click();
}




function renderClientsList() {
    const list = document.getElementById('clientsList');
    if(!list) return;

    const uniqueClients = [...new Set(
        (db.sales || [])
            .map(s => (s.client || '').trim())
            .filter(c => c && c !== 'Brak')
    )].sort();

    list.innerHTML = uniqueClients.map(c =>
        `<option value="${c}">`
    ).join('');
}


function renderClients() {
    const container = document.getElementById('clientsContainer');
    if(!container) return;

    let clients = {};
    (db.sales || []).forEach(s => {
        if(s.name === "TYGODNIÓWKA") return;
        const originalClient = (s.client || "Brak").trim();
        const client = originalClient.toUpperCase();
        if(!clients[client]) clients[client] = { displayName: originalClient, qty:0, rev:0, prof:0, orders:0 };
        clients[client].qty += parseInt(s.qty) || 0;
        clients[client].rev += parseFloat(s.rev) || 0;
        clients[client].prof += parseFloat(s.prof) || 0;
        clients[client].orders += 1;
    });

    const rows = Object.entries(clients).sort((a,b) => b[1].prof - a[1].prof);
    if(rows.length===0){ container.innerHTML='<div style="color:var(--text-dim); text-align:center; padding:20px">Brak klientów.</div>'; return; }
    container.innerHTML = '<table><tr><td><b>Klient</b></td><td><b>Szt.</b></td><td><b>Przychód</b></td><td><b>Zysk</b></td></tr>' +
        rows.map(([key,data]) => `<tr class="clickable-row" onclick="openClientDetails('${encodeURIComponent(key)}')"><td><b>${data.displayName}</b><br><small style="color:var(--text-dim)">${data.orders} zam.</small></td><td>${data.qty}</td><td>${data.rev.toFixed(0)} zł</td><td style="color:var(--success)">${data.prof.toFixed(0)} zł</td></tr>`).join('') + '</table>';
}

function openClientDetails(encodedKey){
    const key=decodeURIComponent(encodedKey);
    const sales=(db.sales||[]).filter(s => s.name!=="TYGODNIÓWKA" && ((s.client||'Brak').trim().toUpperCase()===key));
    if(!sales.length) return;
    const displayName=(sales[0].client||'Brak').trim();
    const totalQty=sales.reduce((a,s)=>a+(parseInt(s.qty)||0),0);
    const totalRev=sales.reduce((a,s)=>a+(parseFloat(s.rev)||0),0);
    const totalProf=sales.reduce((a,s)=>a+(parseFloat(s.prof)||0),0);
    document.getElementById('clientModalTitle').innerText=displayName;
    const history=sales.slice().sort((a,b)=>{ const da=parsePlDate(a.date), dbb=parsePlDate(b.date); return dbb.localeCompare(da); });
    document.getElementById('clientDetails').innerHTML=`
      <div class="details-grid">
        <div class="detail-box"><small>Zamówienia</small><b>${sales.length}</b></div>
        <div class="detail-box"><small>Łącznie sztuk</small><b>${totalQty}</b></div>
        <div class="detail-box"><small>Przychód netto</small><b>${money(totalRev)}</b></div>
        <div class="detail-box"><small>Łączny zysk</small><b style="color:var(--success)">${money(totalProf)}</b></div>
      </div>
      <div style="margin-top:16px"><b>Pełna historia</b></div>
      <div>${history.map(s=>{ const qty=Number(s.qty)||0; const unit=qty?(Number(s.rev)||0)/qty:0; return `<div class="history-item clickable-row" onclick="closeClientModal(); openSaleDetails('${s.id}')"><div class="history-top"><b>${s.name}</b><b>${s.date}</b></div><div class="history-meta">${qty} szt. × ${money(unit)} netto/szt.<br>Razem netto: <b style="color:white">${money(s.rev)}</b> • Zysk: <b style="color:var(--success)">${money(s.prof)}</b></div></div>`; }).join('')}</div>`;
    document.getElementById('clientModalBackdrop').classList.add('open');
}
function closeClientModal(){ document.getElementById('clientModalBackdrop').classList.remove('open'); }

function switchTab(id) { document.querySelectorAll('.card').forEach(c => c.classList.remove('active')); document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); document.getElementById(id).classList.add('active'); const tabMap={calc:'tab1',sales:'tab2',stats:'tab3',clients:'tab4'}; document.getElementById(tabMap[id]).classList.add('active'); if(id==='sales') renderSelect(); if(id==='stats') renderStats(); if(id==='clients') renderClients(); }
</script>
